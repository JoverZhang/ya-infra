<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal inbox</title>
<style>
:root{color-scheme:dark;font:15px/1.6 system-ui;background:#10151c;color:#e8eef5}body{max-width:1000px;margin:0 auto;padding:40px 24px}header{display:flex;justify-content:space-between;align-items:center;gap:24px}h1{font-size:36px;letter-spacing:-1.5px;margin:0}p{color:#98a8ba}button,select{font:inherit;color:inherit;background:#1d2835;border:1px solid #354457;border-radius:8px;padding:7px 12px;cursor:pointer}button:hover{border-color:#6ed9ba}nav{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}.card{border:1px solid #293747;background:#151e29;border-radius:12px;padding:20px;margin:14px 0}.card.unread{border-left:4px solid #6ed9ba}.top{display:flex;gap:12px;justify-content:space-between}h2{font-size:19px;margin:4px 0}a{color:#c7f6e8;text-decoration:none}a:hover{text-decoration:underline}.meta{font-size:12px;color:#98a8ba;text-transform:uppercase;letter-spacing:1px}.reasons{margin:10px 0;color:#b5c4d4}.actions{display:flex;gap:8px;flex-wrap:wrap}.badge{font-size:12px;color:#6ed9ba}.bad{color:#ffb0a5}.empty{text-align:center;padding:60px;border:1px dashed #354457;border-radius:12px}#sources{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;margin-top:30px}.status{padding:10px 14px;border:1px solid #293747;border-radius:8px}#error{color:#ffb0a5}small{color:#98a8ba}details{margin-top:10px}summary{cursor:pointer}
</style></head><body>
<header><div><span class="meta">Your attention, in one place</span><h1>Personal inbox</h1><p>GitHub tasks and deployment status. Read does not mean resolved.</p></div><button id="refresh">Refresh</button></header>
<nav><button data-view="active">Needs attention</button><button data-view="snoozed">Snoozed</button><button data-view="resolved">Recovered / resolved</button><button data-view="all">All</button></nav>
<div id="error" role="alert"></div><main id="items"></main><section id="sources" aria-label="Source status"></section>
<script>
let view='active', snapshot={items:[],sources:[]};
const node=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e};
function render(){const list=document.querySelector('#items');list.replaceChildren();const now=Date.now()/1000;const rows=snapshot.items.filter(i=>view==='all'||(view==='active'&&i.status==='active'&&i.snoozed_until<=now)||(view==='snoozed'&&i.status==='active'&&i.snoozed_until>now)||(view==='resolved'&&i.status==='resolved'));if(!rows.length)list.append(node('div','Nothing here right now. Source checks are shown below.','empty'));for(const it of rows){const card=node('article',undefined,'card'+(it.read?'':' unread'));const top=node('div',undefined,'top');top.append(node('span',it.source,'meta'),node('span',it.status==='resolved'?'Resolved':it.read?'Read · still active':'Needs attention','badge'));card.append(top);const h=node('h2');if(it.url){const a=node('a',it.title);a.href=it.url;a.target='_blank';a.rel='noopener noreferrer';h.append(a)}else h.textContent=it.title;card.append(h);const reasons=node('div',undefined,'reasons');for(const r of it.reasons)reasons.append(node('div',r));card.append(reasons);const actions=node('div',undefined,'actions');for(const [label,read,hours]of [[it.read?'Mark unread':'Mark read',!it.read,0],['Snooze 1h',it.read,1],['Snooze 1d',it.read,24]]){const b=node('button',label);b.onclick=()=>change(it.id,read,hours);actions.append(b)}card.append(actions);if(it.snoozed_until>now)card.append(node('small','Snoozed until '+new Date(it.snoozed_until*1000).toLocaleString()));list.append(card)}const sources=document.querySelector('#sources');sources.replaceChildren();for(const s of snapshot.sources){const e=node('div',undefined,'status');e.append(node('strong',s.source+' · '+(s.ok?'Connected':'Unavailable'),s.ok?'':'bad'),node('div','Checked '+new Date(s.checked*1000).toLocaleString()));if(!s.ok)e.append(node('div',s.detail+' · cached tasks retained'));sources.append(e)}}
async function refresh(){try{const r=await fetch('/api/items');if(r.status===401){location.href='/';return}if(!r.ok)throw Error('Could not read the inbox. Try again.');snapshot=await r.json();document.querySelector('#error').textContent='';render()}catch(e){document.querySelector('#error').textContent=e.message}}
async function change(id,read,hours){try{const r=await fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,read,snooze_hours:hours})});if(!r.ok)throw Error('Could not save your change.');await refresh()}catch(e){document.querySelector('#error').textContent=e.message}}
for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>{view=b.dataset.view;render()};document.querySelector('#refresh').onclick=refresh;refresh();setInterval(refresh,30000);
</script></body></html>
