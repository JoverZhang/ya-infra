apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: check-config
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
secretFrom:
  - metadata:
      name: check-config
      annotations:
        kustomize.config.k8s.io/needs-hash: "true"
    files: [config.yaml=config.sops.yaml]
