apiVersion: v1
kind: Pod
metadata:
  name: FIXTURE_NAME
  namespace: FIXTURE_NAMESPACE
spec:
  restartPolicy: Never
  containers:
    - name: check
      image: FIXTURE_IMAGE
      command: FIXTURE_COMMAND
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: data
