name: ya-infra-cpe

x-runtime: &runtime
  image: ${CPE_IMAGE:-cpe:local}
  pull_policy: never
  init: true
  restart: unless-stopped
  network_mode: host
  working_dir: /app
  depends_on:
    mysql: {condition: service_healthy}
    mongo: {condition: service_healthy}
  secrets:
    - source: ya-infra-cpe-config
      target: /app/config.toml
      mode: "0400"
  volumes:
    - type: bind
      source: ${CPE_SCRIPTS_DIR:?select the worker_scripts directory}
      target: /app/worker_scripts
      read_only: true
      bind: {create_host_path: false}
    - type: bind
      source: ${CPE_DATA_DIR:?select the HDF5 data directory}
      target: /app/data
      read_only: true
      bind: {create_host_path: false}

services:
  mysql:
    image: ghcr.io/computed-parameter/computed-parameter-engine-mysql@sha256:d14140a10302c27a9538484a32baa913a32b908a3a349fb2046270c087326b66
    platform: linux/amd64
    pull_policy: never
    restart: unless-stopped
    ports: ["127.0.0.1:${CPE_MYSQL_PORT:-27032}:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, 127.0.0.1, -uroot, -proot]
      interval: 5s
      timeout: 5s
      retries: 20
  mongo:
    image: ghcr.io/computed-parameter/computed-parameter-engine-mongo@sha256:1368eb7b0c879446c12fd10d04ff8d57e074f9c8a1a1e2108b3720f24298e38c
    platform: linux/amd64
    pull_policy: never
    restart: unless-stopped
    command: [--port, "27018", --wiredTigerCacheSizeGB, "4", --replSet, cpe-local]
    ports: ["127.0.0.1:${CPE_MONGO_PORT:-27270}:27018"]
    volumes: ["mongo_data:/data/db", "mongo_config:/data/configdb"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test ! -s /tmp/docker-entrypoint-temp-mongod.pid &&
          mongosh --quiet --port 27018 -u root -p root --authenticationDatabase admin
          --eval 'try { const status = rs.status(); print(status.ok === 1 && status.myState === 1 ? 1 : 0); }
          catch (error) { if (error.codeName === "NotYetInitialized") {
          rs.initiate({_id: "cpe-local", members: [{_id: 0, host: "localhost:27018"}]}); } print(0); }'
          | tail -n 1 | grep 1
      interval: 5s
      timeout: 5s
      retries: 20
  daemon:
    <<: *runtime
    # Native boot recovery starts containers without Compose health ordering.
    command:
      - sh
      - -ec
      - |
        until cpe-client doctor >/dev/null 2>&1; do sleep 2; done
        exec computed-parameter-engine
    environment:
      RUST_LOG: ${RUST_LOG:-info}
  web:
    <<: *runtime
    command: [node, web/dist/server/index.js]
    environment:
      NODE_ENV: production
      CPE_PROJECT_ROOT: /app
      CPE_CLIENT_BIN: /usr/local/bin/cpe-client
      CPE_WEB_HOST: 127.0.0.1
      CPE_WEB_PORT: ${CPE_WEB_PORT:-27310}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:'+process.env.CPE_WEB_PORT+'/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  mysql_data:
    external: true
    name: ${CPE_MYSQL_VOLUME:?select the existing MySQL volume}
  mongo_data:
    external: true
    name: ${CPE_MONGO_VOLUME:?select the existing Mongo data volume}
  mongo_config:
    external: true
    name: ${CPE_MONGO_CONFIG_VOLUME:?select the existing Mongo config volume}

secrets:
  ya-infra-cpe-config:
    external: true
