name: ya-infra-static-site
services:
  sync:
    image: ${SYNC_IMAGE:?select a pinned git-sync image}
    restart: unless-stopped
    user: "0:0"
    command:
      - --repo=${SITE_REPOSITORY:?select a Git repository URL}
      - --ref=${SITE_BRANCH:-pages}
      - --root=/repo
      - --link=current
      - --depth=1
      - --period=60s
      - --max-failures=-1
      - --stale-worktree-timeout=0s
      - --username=x-access-token
      - --password-file=/run/secrets/site-token
      - --error-file=sync-error
      - --http-bind=:2020
    ports: ["127.0.0.1:${SITE_SYNC_PORT:-18582}:2020"]
    secrets:
      - source: ya-infra-static-site-github
        target: /run/secrets/site-token
        mode: "0400"
    volumes: ["data:/repo"]
  web:
    image: ${WEB_IMAGE:-docker.io/library/node@sha256:54f84b4cf8432b21aaffd5d3ce8d41e12cea0d10d33c09d2f3c9879d49d6b446}
    init: true
    restart: unless-stopped
    user: "0:0"
    working_dir: ${SITE_WORKTREE:?select the live source worktree}
    command:
      - sh
      - -ec
      - npm install && exec npm run dev -- --host 0.0.0.0 --port 8080 --strictPort --base "$$VITE_BASE_PATH"
    environment:
      NODE_ENV: development
      VITE_BASE_PATH: ${SITE_BASE_PATH:-/}
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: ${SITE_DEV_HOST:-localhost}
      AGENTATION_PROXY_TARGET: http://annotations:4747
      VITE_AGENTATION_ENDPOINT: /__annotations
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080'+process.env.VITE_BASE_PATH).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports: ["127.0.0.1:${SITE_PORT:-18581}:8080"]
    volumes:
      - type: bind
        source: ${SITE_WORKTREE:?select the live source worktree}
        target: ${SITE_WORKTREE:?select the live source worktree}
        bind: {create_host_path: false}
  annotations:
    image: ${ANNOTATIONS_IMAGE:-localhost/ya-infra-annotations:local}
    pull_policy: never
    build:
      context: .
      dockerfile: annotations.Dockerfile
    init: true
    restart: unless-stopped
    environment:
      AGENTATION_HOST: 0.0.0.0
      AGENTATION_CORS_ORIGINS: ${SITE_ORIGIN:?select the exact preview origin}
    ports: ["127.0.0.1:${ANNOTATIONS_PORT:-4747}:4747"]
    volumes: ["annotations:/home/node/.agentation"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4747/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
volumes:
  data:
    external: true
    name: ${SITE_DATA_VOLUME:-static-site-data}
  annotations:
    external: true
    name: ${ANNOTATIONS_DATA_VOLUME:-static-site-annotations}
secrets:
  ya-infra-static-site-github:
    external: true
