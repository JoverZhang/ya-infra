name: ya-infra-static-site
services:
  sync:
    image: ${SITE_SYNC_IMAGE:-localhost/ya-infra-static-site:local}
    build:
      context: .
      args:
        SYNC_IMAGE: ${SYNC_IMAGE:?select a pinned git-sync image}
    restart: unless-stopped
    user: "0:0"
    command:
      - --repo=${SITE_REPOSITORY:?select a Git repository URL}
      - --ref=${SITE_BRANCH:-pages}
      - --root=/repo
      - --link=current
      - --depth=1
      - --period=60s
      - --max-failures=-1
      - --stale-worktree-timeout=30m
      - --exechook-command=/usr/local/bin/build-site
      - --exechook-timeout=15m
      - --exechook-backoff=60s
      - --username=x-access-token
      - --password-file=/run/secrets/site-token
      - --error-file=sync-error
      - --http-bind=:2020
    environment:
      VITE_BASE_PATH: ${SITE_BASE_PATH:-/}
    ports: ["127.0.0.1:${SITE_SYNC_PORT:-18582}:2020"]
    secrets:
      - source: ya-infra-static-site-github
        target: /run/secrets/site-token
        mode: "0400"
    volumes: ["data:/repo"]
  web:
    image: ${WEB_IMAGE:?select a pinned Caddy image}
    restart: unless-stopped
    command: [caddy, run, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports: ["127.0.0.1:${SITE_PORT:-18581}:8080"]
    environment:
      SITE_BASE_PATH: ${SITE_BASE_PATH:-/}
    volumes:
      - type: volume
        source: data
        target: /repo
        read_only: true
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind: {create_host_path: false}
volumes:
  data:
    external: true
    name: ${SITE_DATA_VOLUME:-static-site-data}
secrets:
  ya-infra-static-site-github:
    external: true
