apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: tbg-server
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
secretFrom:
  - metadata:
      name: tbg-server
      annotations:
        kustomize.config.k8s.io/needs-hash: "true"
    type: Opaque
    files:
      - server.yaml=config.sops.yaml
