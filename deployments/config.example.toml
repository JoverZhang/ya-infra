# Copy to ./config.toml in the directory where you run commands.
# Replace the gateway identifiers and route hostnames before publishing.

[gateway.public]
provider = "cloudflare-tunnel"
zone = "example.com"
account_id = "00000000000000000000000000000000"
tunnel_id = "00000000-0000-0000-0000-000000000001"

[gateway.routes.paseo-web]
gateway = "public"
hostname = "paseo.example.com"
backend = "paseo-web/main"

[gateway.routes.paseo1]
gateway = "public"
hostname = "paseo1.example.com"
backend = "paseo/demo"

[services.paseo.versions]
build_mode = "local-snapshot"
artifact_layout = 2
base_image = "docker.io/library/node@sha256:8f693eaa7e0a8e71560c9a82b55fd54c2ae920a2ba5d2cde28bac7d1c01c9ba5"
paseo_version = "0.9.1"
codex_version = "0.159.2"
node_version = "25.9.0"
image_ref = "localhost/infra-paseo:0.9.1-codex-0.159.2"

[services.paseo.instances.demo]
port = 16770
cpus = 2
memory = "4g"
pids_limit = 512

[services.paseo-web]
port = 16780
base_image = "docker.io/nginxinc/nginx-unprivileged@sha256:15c994d10d6d78658721c3bcafff14cb281fba2a4bdf9d5ba92c416a472516e3"
image_ref = "localhost/infra-paseo-web:0.9.1"

[services.cloudflare-tunnel]
cloudflared_version = "2026.7.2"
image_ref = "docker.io/cloudflare/cloudflared@sha256:18626b1baac4450214535cd5bc40ef44c0635244d585ebf707749c22b6f3408f"
metrics_port = 20242
cpus = 1
memory = "512m"
pids_limit = 128
