gateways:
  public:
    zone: example.com
    account_id: "00000000000000000000000000000000"
    tunnel_id: "00000000-0000-0000-0000-000000000001"
    api_token: REPLACE_WITH_MANAGEMENT_TOKEN
    tunnel_token: REPLACE_WITH_CONNECTOR_TOKEN
